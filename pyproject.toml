[project]
name = "consumer"
version = "0.1.0"
description = "Sistema de gerenciamento consumer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.37.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.19.0",
    "plotly>=5.14.0",
    "openpyxl>=3.1.0",
    "pywin32==306",
    "reportlab==4.4.3",
    "requests",
    "folium>=0.20.0",
    "streamlit-folium>=0.25.3",
    "pip-system-certs>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []

[tool.setuptools]
py-modules = []
