[project]
name = "gordon"
version = "0.1.0"
description = "Sistema de gerenciamento Gordon"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.37.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.14.0",
    "openpyxl>=3.1.0",
    "reportlab==4.4.3",
    "requests",
    "folium>=0.20.0",
    "streamlit-folium>=0.25.3",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.54",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
windows = ["pywin32==306"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []